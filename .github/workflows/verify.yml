name: Verify desktop

on:
    push:
        branches: [master]
    pull_request:

permissions:
    contents: read

jobs:
    verify:
        strategy:
            fail-fast: false
            matrix:
                os: [macos-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - uses: dtolnay/rust-toolchain@1.94.1
              with:
                  components: rustfmt, clippy
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri
            - run: npm ci
            - run: npm run format:check
            - run: npm run build
            - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --test workflow_launcher --test validation_queue --test managed_workloads
            - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
            - run: cargo build --locked --manifest-path src-tauri/Cargo.toml --bin jitterbug

    ui:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npx playwright install --with-deps chromium --only-shell
            - run: npm run test:ui
