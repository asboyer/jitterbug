[package]
name = "jitterbug"
version = "0.1.0"
description = "A resource-aware desktop assistant"
edition = "2021"
default-run = "jitterbug"

[lib]
name = "jitterbug_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.12", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.38.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros"] }
dotenvy = "0.15"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
fs2 = "0.4"
base64 = "0.22"
dirs = "7"
sha2 = "0.10"
getrandom = "0.3"
toml_edit = "0.25"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSProcessInfo"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "NSGraphics", "NSScreen", "NSStatusItem", "NSStatusBarButton", "NSWindow", "NSView"] }

[target.'cfg(target_os = "windows")'.dependencies]
png = "0.18"
windows = { version = "0.62", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
